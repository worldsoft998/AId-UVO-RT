<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c636a"/>
    </marker>
    <style>
      .band  { fill:#f8f9fa; stroke:#dee2e6; stroke-width:1; }
      .box   { fill:#ffffff; stroke:#adb5bd; stroke-width:1.2; rx:6; }
      .hot   { fill:#e7f0ff; stroke:#2f6feb; stroke-width:1.6; rx:6; }
      .sim   { fill:#fff4e6; stroke:#e8590c; stroke-width:1.6; rx:6; }
      .t     { font-size:13px; fill:#1b1f24; }
      .ts    { font-size:11px; fill:#5c636a; }
      .h     { font-size:12px; font-weight:600; fill:#343a40; letter-spacing:.3px; }
      .ln    { stroke:#5c636a; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- entry -->
  <rect class="band" x="20" y="16" width="940" height="62" rx="8"/>
  <text class="h" x="34" y="36">ENTRY POINTS</text>
  <rect class="box" x="34" y="44" width="200" height="26"/><text class="t" x="44" y="62">scripts\windows\*.bat</text>
  <rect class="box" x="248" y="44" width="180" height="26"/><text class="t" x="258" y="62">scripts\linux\*.sh</text>
  <rect class="box" x="442" y="44" width="220" height="26"/><text class="t" x="452" y="62">python -m aiduvo &lt;cmd&gt;</text>

  <!-- engine -->
  <rect class="band" x="20" y="92" width="940" height="86" rx="8"/>
  <text class="h" x="34" y="112">CAMPAIGN ENGINE  (aiduvo/core)</text>
  <rect class="hot" x="34" y="122" width="470" height="46"/>
  <text class="t" x="46" y="142">Campaign: budget · reward · state encoder · action space</text>
  <text class="ts" x="46" y="158">one loop, one reward, one accounting for all three modes</text>
  <rect class="box" x="520" y="122" width="150" height="46"/>
  <text class="t" x="532" y="142">RL / ANN policy</text><text class="ts" x="532" y="158">numpy, local only</text>
  <rect class="box" x="686" y="122" width="150" height="46"/>
  <text class="t" x="698" y="142">history.sqlite</text><text class="ts" x="698" y="158">resumable, auditable</text>

  <!-- backends -->
  <rect class="band" x="20" y="192" width="940" height="76" rx="8"/>
  <text class="h" x="34" y="212">BACKENDS</text>
  <rect class="box" x="34" y="222" width="280" height="36"/>
  <text class="t" x="46" y="245">RuntimeBackend — live SRIE</text>
  <rect class="box" x="330" y="222" width="280" height="36"/>
  <text class="t" x="342" y="245">BlackboxBackend — vsim + UCDB</text>
  <rect class="box" x="626" y="222" width="210" height="36"/>
  <text class="t" x="638" y="245">MockBlackboxBackend</text>

  <!-- srie -->
  <rect class="band" x="20" y="282" width="940" height="86" rx="8"/>
  <text class="h" x="34" y="302">SRIE — Simulator Runtime Introspection Engine  (aiduvo/srie)</text>
  <rect class="box" x="34" y="312" width="220" height="46"/>
  <text class="t" x="46" y="332">transport</text><text class="ts" x="46" y="348">pipe · socket · FLI · mock</text>
  <rect class="box" x="270" y="312" width="230" height="46"/>
  <text class="t" x="282" y="332">introspection (read)</text><text class="ts" x="282" y="348">describe · examine · coverage</text>
  <rect class="box" x="516" y="312" width="230" height="46"/>
  <text class="t" x="528" y="332">reflection (write)</text><text class="ts" x="528" y="348">force · release · when · run</text>
  <rect class="box" x="762" y="312" width="170" height="46"/>
  <text class="t" x="774" y="332">launcher</text><text class="ts" x="774" y="348">vsim argv builder</text>

  <!-- simulator -->
  <rect class="band" x="20" y="382" width="940" height="90" rx="8"/>
  <text class="h" x="34" y="402">SIMULATOR  (untouched source)</text>
  <rect class="sim" x="34" y="412" width="240" height="48"/>
  <text class="t" x="46" y="432">QuestaSim vsim</text><text class="ts" x="46" y="448">elaborated, driven in quanta</text>
  <rect class="box" x="292" y="412" width="200" height="48"/>
  <text class="t" x="304" y="432">UCDB</text><text class="ts" x="304" y="448">UCIS XML export</text>
  <rect class="box" x="510" y="412" width="200" height="48"/>
  <text class="t" x="522" y="432">transcript</text><text class="ts" x="522" y="448">errors · progress · markers</text>
  <rect class="box" x="728" y="412" width="204" height="48"/>
  <text class="t" x="740" y="432">RTL · TB · UVM</text><text class="ts" x="740" y="448">never read, never written</text>

  <!-- reporting -->
  <rect class="band" x="20" y="486" width="940" height="70" rx="8"/>
  <text class="h" x="34" y="506">REPORTING</text>
  <rect class="box" x="34" y="514" width="200" height="32"/>
  <text class="t" x="46" y="535">compare + metrics</text>
  <rect class="box" x="248" y="514" width="200" height="32"/>
  <text class="t" x="260" y="535">SVG charts (no deps)</text>
  <rect class="box" x="462" y="514" width="200" height="32"/>
  <text class="t" x="474" y="535">report.md / report.html</text>
  <rect class="box" x="676" y="514" width="256" height="32"/>
  <text class="t" x="688" y="535">lint: non-intrusiveness compliance</text>

  <!-- arrows -->
  <path class="ln" d="M 400 78 L 400 118"/>
  <path class="ln" d="M 160 168 L 160 218"/>
  <path class="ln" d="M 440 168 L 440 218"/>
  <path class="ln" d="M 720 168 L 720 218"/>
  <path class="ln" d="M 170 258 L 170 308"/>
  <path class="ln" d="M 380 258 L 380 308"/>
  <path class="ln" d="M 630 258 L 630 308"/>
  <path class="ln" d="M 150 358 L 150 408"/>
  <path class="ln" d="M 392 358 L 392 408"/>
  <path class="ln" d="M 610 358 L 610 408"/>
  <path class="ln" d="M 520 460 L 520 510"/>
</svg>
